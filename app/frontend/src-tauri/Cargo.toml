[package]
name = "novadraft-ideation"
version = "0.1.0"
description = "Research Ideation desktop app"
edition = "2021"

[lib]
name = "novadraft_ideation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
